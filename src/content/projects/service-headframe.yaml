# INFO card (concise)
impact: >
  Rebuilt the entire mine service headframe tower in Inventor and AutoCAD from 1960s-era
  drawings — producing slinging/rigging documentation, a six-drawing package for third-party
  industrial contractors, fire-safety floor plans, and a geometrical simulation application.

# HERO SECTION — text (left) + video showcase (right)
showcase:
  heading: Geometrical confirmation from simulation saves money.
  body: >
    As I had already modeled the entire service shaft tower and created a drawing package for
    slinging engineering documentation, this was simply a step ahead — a 3D simulation and
    geometrical confirmation for slinging some brine pipes down the shaft inside the bail. This
    is the render footage from Navisworks, which aided in saving $125,000: the cost of ordering
    cut piping if we were unsure of the fit.
  video: initial-surface-render.mp4
  poster: initial-surface-render.jpg
  button: { label: "Behind the scenes", href: "#gallery" }

