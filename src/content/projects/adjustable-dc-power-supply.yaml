# HERO SECTION — text (left) + schematic image (right)
showcase:
  heading: Simple supply design with noise filtering.
  body: >
    Output voltage adjustable from 0–15 V, with an adjustable current limit from 0–3 A.
    Filtered through three 2nd-order Sallen–Key low-pass active filters forming a 6th-order
    Butterworth response.
  img: schematic.jpg

